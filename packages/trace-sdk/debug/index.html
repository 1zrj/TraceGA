<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraceGA SDK 可视化联调</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      min-height: 100vh;
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    ::-webkit-scrollbar-corner { background: transparent; }

    * { scrollbar-width: thin; scrollbar-color: #30363d transparent; }
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 20px; font-weight: 600; color: #58a6ff; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block;
      background: #3fb950;
    }
    .status-dot.off { background: #f85149; }
    .container {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 16px;
      padding: 16px 24px;
      height: calc(100vh - 65px);
    }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      padding: 12px 16px;
      background: #1c2128;
      border-bottom: 1px solid #30363d;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-body { padding: 16px; overflow-y: auto; flex: 1; min-height: 0; }
    .left-panel { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; }
    .right-panel { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block; font-size: 12px; color: #8b949e;
      margin-bottom: 4px; font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%; padding: 8px 12px; font-size: 13px;
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      color: #e1e4e8; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: #58a6ff; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }

    .btn {
      padding: 8px 16px; font-size: 13px; border: 1px solid #30363d;
      border-radius: 6px; cursor: pointer; font-weight: 500;
      transition: all 0.15s; background: #21262d; color: #c9d1d9;
    }
    .btn:hover { background: #30363d; }
    .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-danger { background: #da3633; border-color: #f85149; color: #fff; }
    .btn-danger:hover { background: #f85149; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-block { width: 100%; }

    .event-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .event-btn {
      padding: 10px; font-size: 12px; text-align: center;
      background: #21262d; border: 1px solid #30363d; border-radius: 6px;
      cursor: pointer; color: #c9d1d9; transition: all 0.15s;
    }
    .event-btn:hover { background: #30363d; border-color: #58a6ff; }
    .event-btn .icon { font-size: 18px; display: block; margin-bottom: 4px; }

    .log-container {
      flex: 1; min-height: 0; overflow-y: auto;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 12px; line-height: 1.6;
    }
    .log-entry {
      padding: 6px 12px; border-bottom: 1px solid #21262d;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .log-entry:hover { background: #1c2128; }
    .log-time { color: #484f58; white-space: nowrap; min-width: 75px; }
    .log-tag {
      padding: 1px 6px; border-radius: 4px; font-size: 10px;
      font-weight: 600; white-space: nowrap; min-width: 50px; text-align: center;
    }
    .log-tag.info { background: #1f6feb33; color: #58a6ff; }
    .log-tag.success { background: #23863633; color: #3fb950; }
    .log-tag.error { background: #da363333; color: #f85149; }
    .log-tag.event { background: #a371f733; color: #a371f7; }
    .log-tag.network { background: #d2992233; color: #d29922; }
    .log-msg { color: #c9d1d9; word-break: break-all; flex: 1; }

    .stats-bar {
      display: flex; gap: 16px; padding: 8px 16px;
      background: #0d1117; border-radius: 6px; margin-bottom: 8px;
    }
    .stat-item { text-align: center; }
    .stat-value { font-size: 20px; font-weight: 700; color: #58a6ff; }
    .stat-label { font-size: 11px; color: #8b949e; }

    .plugin-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid #21262d;
    }
    .plugin-toggle:last-child { border-bottom: none; }
    .plugin-name { font-size: 13px; font-weight: 500; }
    .plugin-desc { font-size: 11px; color: #8b949e; }
    .toggle {
      position: relative; width: 40px; height: 22px; cursor: pointer;
    }
    .toggle input { display: none; }
    .toggle-slider {
      position: absolute; inset: 0; background: #30363d;
      border-radius: 22px; transition: 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 16px; height: 16px;
      left: 3px; bottom: 3px; background: #c9d1d9;
      border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #238636; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

    .custom-event-form {
      background: #0d1117; border-radius: 6px; padding: 12px;
      margin-top: 8px;
    }
    .custom-event-form textarea {
      width: 100%; min-height: 60px; padding: 8px;
      background: #161b22; border: 1px solid #30363d; border-radius: 4px;
      color: #e1e4e8; font-family: monospace; font-size: 12px;
      resize: vertical; outline: none;
    }
    .custom-event-form textarea:focus { border-color: #58a6ff; }

    .empty-log {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: #484f58;
    }
    .empty-log .icon { font-size: 40px; margin-bottom: 8px; }

    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-row .btn { flex: 1; }

    .section-title {
      font-size: 11px; color: #8b949e; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 8px; margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="status-dot" id="statusDot"></span>
    <h1>TraceGA SDK 可视化联调</h1>
    <span style="font-size:12px;color:#8b949e;" id="sdkVersion"></span>
  </div>

  <div class="container">
    <!-- 左侧：配置 & 触发面板 -->
    <div class="left-panel">
      <!-- 配置面板 -->
      <div class="panel">
        <div class="panel-header">⚙ 配置</div>
        <div class="panel-body">
          <div class="form-group">
            <label>上报地址 (reportUrl)</label>
            <input type="text" id="reportUrl" value="http://localhost:3000/api/track" placeholder="http://localhost:3000/api/track">
          </div>
          <div class="form-group">
            <label>应用 ID (appId)</label>
            <input type="text" id="appId" value="proj_test_001" placeholder="proj_test_001">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>采样率</label>
              <select id="sampleRate">
                <option value="1">100%</option>
                <option value="0.5">50%</option>
                <option value="0.1">10%</option>
              </select>
            </div>
            <div class="form-group">
              <label>缓冲大小</label>
              <select id="maxBufferSize">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20" selected>20</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>刷新间隔 (ms)</label>
              <input type="number" id="flushInterval" value="3000" min="100" step="100" style="width:100%;box-sizing:border-box;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:14px;">
            </div>
            <div class="form-group">
              <label>最大并发</label>
              <input type="number" id="maxConcurrentRequests" value="3" min="1" max="20" style="width:100%;box-sizing:border-box;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:14px;">
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary btn-block" onclick="initSDK()">初始化 SDK</button>
            <button class="btn btn-danger btn-block" onclick="destroySDK()">销毁</button>
          </div>
        </div>
      </div>

      <!-- 插件开关 -->
      <div class="panel">
        <div class="panel-header">🔌 内置插件</div>
        <div class="panel-body" id="pluginToggles">
          <div class="plugin-toggle">
            <div>
              <div class="plugin-name">ErrorPlugin</div>
              <div class="plugin-desc">JS / Promise / 资源 / HTTP 错误</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="pluginError" onchange="onPluginChange()">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="plugin-toggle">
            <div>
              <div class="plugin-name">BehaviorPlugin</div>
              <div class="plugin-desc">点击 / 页面浏览 / 曝光</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="pluginBehavior" onchange="onPluginChange()">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="plugin-toggle">
            <div>
              <div class="plugin-name">PerformancePlugin</div>
              <div class="plugin-desc">Web Vitals / 资源性能</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="pluginPerformance" onchange="onPluginChange()">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="plugin-toggle">
            <div>
              <div class="plugin-name">WhiteScreenPlugin</div>
              <div class="plugin-desc">白屏检测 / 像素对比</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="pluginWhiteScreen" onchange="onPluginChange()">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div style="margin-top:8px;font-size:11px;color:#f85149;">
            注意：切换插件需要重新初始化 SDK
          </div>
        </div>
      </div>

      <!-- 事件触发面板 -->
      <div class="panel">
        <div class="panel-header">🎯 手动触发事件</div>
        <div class="panel-body">
          <div class="section-title">基础事件</div>
          <div class="event-grid">
            <button class="event-btn" onclick="sendEvent('custom_event', 'normal', 'custom')">
              <span class="icon">📝</span>自定义事件
            </button>
            <button class="event-btn" onclick="sendEvent('button_click', 'normal', 'click')">
              <span class="icon">👆</span>点击事件
            </button>
            <button class="event-btn" onclick="sendEvent('page_view', 'normal', 'page_view')">
              <span class="icon">📄</span>页面浏览
            </button>
            <button class="event-btn" onclick="sendEvent('exposure_event', 'normal', 'exposure')">
              <span class="icon">👁</span>曝光事件
            </button>
          </div>

          <div class="section-title" style="margin-top:12px;">优先级测试</div>
          <div class="btn-row">
            <button class="btn btn-sm" style="border-color:#f85149;color:#f85149;" onclick="sendEvent('urgent_test', 'urgent', 'custom')">urgent</button>
            <button class="btn btn-sm" style="border-color:#d29922;color:#d29922;" onclick="sendEvent('high_test', 'high', 'custom')">high</button>
            <button class="btn btn-sm" onclick="sendEvent('normal_test', 'normal', 'custom')">normal</button>
          </div>

          <div class="section-title" style="margin-top:12px;">自定义参数事件</div>
          <div class="custom-event-form">
            <div class="form-row">
              <div class="form-group">
                <label>事件名</label>
                <input type="text" id="customEventName" value="custom_action" placeholder="事件名">
              </div>
              <div class="form-group">
                <label>优先级</label>
                <select id="customEventPriority">
                  <option value="normal">normal</option>
                  <option value="high">high</option>
                  <option value="urgent">urgent</option>
                </select>
              </div>
              <div class="form-group">
                <label>事件类型</label>
                <select id="customEventType">
                  <option value="custom">custom</option>
                  <option value="click">click</option>
                  <option value="page_view">page_view</option>
                  <option value="exposure">exposure</option>
                  <option value="error">error</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>参数 (JSON)</label>
              <textarea id="customEventParams">{"action": "test", "value": 123}</textarea>
            </div>
            <button class="btn btn-primary btn-block btn-sm" onclick="sendCustomEvent()">发送自定义事件</button>
          </div>

          <div class="section-title" style="margin-top:12px;">批量测试</div>
          <div class="btn-row">
            <button class="btn btn-sm" onclick="batchSend(5)">批量 x5</button>
            <button class="btn btn-sm" onclick="batchSend(20)">批量 x20</button>
            <button class="btn btn-sm" onclick="batchSend(50)">批量 x50</button>
          </div>
          <div class="btn-row" style="margin-top:4px;">
            <button class="btn btn-sm" onclick="manualFlush()">手动刷新 (flush)</button>
          </div>

          <div class="section-title" style="margin-top:12px;">公共参数</div>
          <div class="form-row">
            <div class="form-group">
              <label>用户 ID</label>
              <input type="text" id="userId" value="test-user-001" placeholder="用户 ID">
            </div>
          </div>
          <button class="btn btn-sm btn-block" onclick="setUser()">设置用户</button>
        </div>
      </div>
    </div>

    <!-- 右侧：日志 & 统计面板 -->
    <div class="right-panel">
      <!-- 统计 -->
      <div class="panel">
        <div class="panel-header">📊 实时统计</div>
        <div class="panel-body" style="padding:8px 16px;">
          <div class="stats-bar">
            <div class="stat-item">
              <div class="stat-value" id="statTotal">0</div>
              <div class="stat-label">总事件</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="statSuccess">0</div>
              <div class="stat-label">成功</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="statFailed">0</div>
              <div class="stat-label">失败</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="statPending">0</div>
              <div class="stat-label">待发送</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 日志面板 -->
      <div class="panel" style="flex:1;display:flex;flex-direction:column;min-height:0;">
        <div class="panel-header">
          📋 事件日志
          <span style="margin-left:auto;font-size:11px;color:#8b949e;cursor:pointer;" onclick="clearLogs()">清空</span>
        </div>
        <div class="log-container" id="logContainer">
          <div class="empty-log">
            <div class="icon">📭</div>
            <div>等待事件...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../dist/index.umd.js"></script>
  <script>
    // ========== 状态管理 ==========
    const stats = { total: 0, success: 0, failed: 0, pending: 0 };
    let sdkReady = false;

    // ========== 日志系统 ==========
    function addLog(tag, msg, tagClass) {
      const container = document.getElementById('logContainer');
      // 移除空状态
      const emptyEl = container.querySelector('.empty-log');
      if (emptyEl) emptyEl.remove();

      const now = new Date();
      const time = now.toLocaleTimeString('zh-CN', { hour12: false }) + '.' + String(now.getMilliseconds()).padStart(3, '0');

      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `
        <span class="log-time">${time}</span>
        <span class="log-tag ${tagClass}">${tag}</span>
        <span class="log-msg">${escapeHtml(msg)}</span>
      `;
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;

      // 限制日志数量
      while (container.children.length > 200) {
        container.removeChild(container.firstChild);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = typeof str === 'string' ? str : JSON.stringify(str, null, 2);
      return div.innerHTML;
    }

    function clearLogs() {
      const container = document.getElementById('logContainer');
      container.innerHTML = '<div class="empty-log"><div class="icon">📭</div><div>等待事件...</div></div>';
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statSuccess').textContent = stats.success;
      document.getElementById('statFailed').textContent = stats.failed;
      document.getElementById('statPending').textContent = stats.pending;
    }

    function updateStatus(ready) {
      sdkReady = ready;
      const dot = document.getElementById('statusDot');
      dot.className = 'status-dot' + (ready ? '' : ' off');
    }

    // ========== SDK 操作 ==========
    function initSDK() {
      const config = {
        appId: document.getElementById('appId').value || 'debug-project',
        reportUrl: document.getElementById('reportUrl').value || 'http://localhost:3000/api/track',
        sampleRate: parseFloat(document.getElementById('sampleRate').value),
        maxBufferSize: parseInt(document.getElementById('maxBufferSize').value),
        flushInterval: parseInt(document.getElementById('flushInterval').value),
        maxConcurrentRequests: parseInt(document.getElementById('maxConcurrentRequests').value),
        enableDebug: true,
        plugins: {
          error: document.getElementById('pluginError').checked,
          event: document.getElementById('pluginBehavior').checked,
          performance: document.getElementById('pluginPerformance').checked,
          whiteScreen: document.getElementById('pluginWhiteScreen').checked,
        },
        hooks: {
          onReady: (cfg) => {
            addLog('INFO', 'SDK 初始化完成: appId=' + cfg.appId + ', reportUrl=' + cfg.reportUrl, 'success');
            updateStatus(true);
          },
          onBeforeTrack: (event) => {
            addLog('BEFORE', '事件名: ' + event.eventName + ', 类型: ' + event.eventType, 'info');
            return event;
          },
          onTrack: (event) => {
            stats.total++;
            stats.pending++;
            updateStats();
            addLog('EVENT', JSON.stringify({
              eventName: event.eventName,
              eventType: event.eventType,
              appId: event.appId,
              timestamp: event.timestamp,
              properties: event.properties
            }), 'event');
          },
          onError: (error, context) => {
            stats.failed++;
            updateStats();
            addLog('ERROR', '[' + (context || 'unknown') + '] ' + (error?.message || error), 'error');
          },
        }
      };

      try {
        addLog('INFO', '正在初始化 SDK... 配置: ' + JSON.stringify({
          appId: config.appId,
          reportUrl: config.reportUrl,
          sampleRate: config.sampleRate,
          maxBufferSize: config.maxBufferSize,
          flushInterval: config.flushInterval,
          plugins: config.plugins,
        }), 'info');

        // 使用 TraceGASDK 全局变量
        if (typeof TraceGASDK === 'undefined') {
          addLog('ERROR', 'SDK 未加载！请检查 dist/index.umd.js 是否存在', 'error');
          return;
        }

        TraceGASDK.register(config);
      } catch (e) {
        addLog('ERROR', '初始化失败: ' + e.message, 'error');
      }
    }

    function destroySDK() {
      try {
        TraceGASDK.destroy();
        updateStatus(false);
        // 重置统计
        stats.total = 0;
        stats.success = 0;
        stats.failed = 0;
        stats.pending = 0;
        updateStats();
        addLog('INFO', 'SDK 已销毁（统计已重置）', 'info');
      } catch (e) {
        addLog('ERROR', '销毁失败: ' + e.message, 'error');
      }
    }

function buildEventProperties(eventType) {
      const base = { source: 'debug-panel' };
      switch (eventType) {
        case 'page_view':
          base.url = window.location.href;
          break;
        case 'click':
          base.elementId = 'debug-btn-' + Date.now();
          break;
        case 'error':
          base.message = 'Debug test error at ' + new Date().toISOString();
          base.stack = 'Error: debug test\n    at sendEvent (debug)';
          break;
        case 'performance':
          base.fcp = Math.random() * 1000 + 500;
          base.lcp = Math.random() * 2000 + 1000;
          break;
        case 'white_screen':
          base.blankDuration = 0;
          base.domCount = 100;
          break;
        default:
          break;
      }
      return base;
    }
    function sendEvent(eventName, priority, eventType) {
      if (!sdkReady) {
        addLog('WARN', '请先初始化 SDK', 'error');
        return;
      }
      try {
        const props = buildEventProperties(eventType);
        TraceGASDK.trackEvent(eventName, props, priority, eventType);
        addLog('SEND', '发送事件: ' + eventName + ' (type: ' + eventType + ', priority: ' + priority + ')', 'info');
      } catch (e) {
        addLog('ERROR', '发送失败: ' + e.message, 'error');
      }
    }

    function sendCustomEvent() {
      if (!sdkReady) {
        addLog('WARN', '请先初始化 SDK', 'error');
        return;
      }
      const name = document.getElementById('customEventName').value || 'custom_action';
      const priority = document.getElementById('customEventPriority').value;
      const eventType = document.getElementById('customEventType').value;
      const paramsStr = document.getElementById('customEventParams').value;
      let params = {};
      try {
        params = JSON.parse(paramsStr);
      } catch (e) {
        addLog('ERROR', '参数 JSON 解析失败: ' + e.message, 'error');
        return;
      }
      try {
        TraceGASDK.trackEvent(name, params, priority, eventType);
        addLog('SEND', '自定义事件: ' + name + ' (type: ' + eventType + ', priority: ' + priority + ') ' + JSON.stringify(params), 'info');
      } catch (e) {
        addLog('ERROR', '发送失败: ' + e.message, 'error');
      }
    }

    function batchSend(count) {
      if (!sdkReady) {
        addLog('WARN', '请先初始化 SDK', 'error');
        return;
      }
      addLog('INFO', '开始批量发送 ' + count + ' 个事件...', 'info');
      for (let i = 0; i < count; i++) {
        try {
          TraceGASDK.trackEvent('batch_event_' + i, { index: i, batch: true, elementId: 'batch-btn-' + i }, 'normal', 'click');
        } catch (e) {
          addLog('ERROR', '批量发送 #' + i + ' 失败: ' + e.message, 'error');
          break;
        }
      }
      addLog('INFO', '批量发送完成: ' + count + ' 个事件已入队', 'success');
    }

    function manualFlush() {
      if (!sdkReady) {
        addLog('WARN', '请先初始化 SDK', 'error');
        return;
      }
      try {
        TraceGASDK.flush();
        addLog('INFO', '手动刷新已触发', 'info');
      } catch (e) {
        addLog('ERROR', '刷新失败: ' + e.message, 'error');
      }
    }

    function setUser() {
      if (!sdkReady) {
        addLog('WARN', '请先初始化 SDK', 'error');
        return;
      }
      const userId = document.getElementById('userId').value;
      try {
        TraceGASDK.setUser(userId);
        addLog('INFO', '用户已设置: ' + userId, 'success');
      } catch (e) {
        addLog('ERROR', '设置用户失败: ' + e.message, 'error');
      }
    }

    function onPluginChange() {
      addLog('WARN', '插件配置已更改，请重新点击"初始化 SDK"生效', 'info');
    }

    // ========== 拦截网络请求进行监控 ==========
    const origFetch = window.fetch;
    window.fetch = function(...args) {
      const url = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
      if (url.includes('/api/track')) {
        addLog('NET', 'Fetch → ' + url, 'network');
// 从请求 body 中解析事件数量，用于准确更新 pending 计数
        let eventCount = 1;
        try {
          const body = args[1]?.body;
          if (typeof body === 'string') {
            const parsed = JSON.parse(body);
            eventCount = parsed?.events?.length || 1;
          }
        } catch { /* 解析失败使用默认值 */ }

        return origFetch.apply(this, args).then(async res => {
          // 先 clone 一份给 SDK 内部解析，本拦截器只读不消费
          const clone = res.clone();
          let isBatchError = false;
          try {
            const body = await clone.json();
            if (body && typeof body === 'object' && body.failedCount > 0) {
              isBatchError = true;
            }
          } catch {
            // 非 JSON 响应忽略
          }

          if (res.ok && !isBatchError) {
            stats.success += eventCount;
            stats.pending = Math.max(0, stats.pending - eventCount);
            updateStats();
            addLog('NET', '响应成功: ' + res.status + ' (' + eventCount + ' 事件)', 'success');
          } else {
            stats.failed += eventCount;
            stats.pending = Math.max(0, stats.pending - eventCount);
            updateStats();
            const detail = isBatchError ? ' (部分事件被拦截)' : (' ' + res.statusText);
            addLog('NET', '响应失败: ' + res.status + detail, 'error');
          }
          return res;
        }).catch(err => {
          stats.failed += eventCount;
          stats.pending = Math.max(0, stats.pending - eventCount);
          updateStats();
          addLog('NET', '网络错误: ' + err.message, 'error');
          throw err;
        });
      }
      return origFetch.apply(this, args);
    };

    // ========== 初始化 ==========
    document.getElementById('sdkVersion').textContent = 'v' + (TraceGASDK?.SDK_VERSION || '?.?.?');
    updateStatus(false);

    // 页面加载时自动初始化
    addLog('INFO', 'SDK 联调页面已加载，请配置参数后点击"初始化 SDK"', 'info');
    addLog('INFO', 'SDK 版本: ' + (TraceGASDK?.SDK_VERSION || 'unknown'), 'info');
  </script>
</body>
</html>
